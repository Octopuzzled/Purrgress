services:
  pocketbase:
    build:
      context: .
      args:
        PB_VERSION: "0.40.4"
    image: purrgress-api:0.40.4
    container_name: purrgress-api
    restart: unless-stopped
    ports:
      # nur lokal erreichbar – nach außen geht es über Caddy
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
